name: validate

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: Compatibility and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test

  locked-reproduction:
    name: Locked reproduction (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-reproduce-lock.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-reproduce-lock.txt
      - run: pip install -e . --no-deps
      - run: make reproduce
      - run: make verify
