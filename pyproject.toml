[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fifteenpick-kbo-win-probability"
version = "2.0.0"
description = "Leakage-controlled KBO win-probability research with role-aware player-performance indices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jiho Choi"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn==1.8.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "joblib>=1.3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
research = ["xgboost>=2", "lightgbm>=4", "catboost>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
