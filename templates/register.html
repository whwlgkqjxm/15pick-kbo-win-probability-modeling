{% extends "_base.html" %}

{% block content %}
<section class="auth-shell">
    <article class="content-card auth-card">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Create Account</p>
                <h1>회원가입</h1>
            </div>
        </div>
        <form method="post" action="{{ url_for('register') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-field">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" required minlength="3" autocomplete="username">
            </div>
            <div class="form-field">
                <label for="display_name">표시 이름</label>
                <input type="text" id="display_name" name="display_name" placeholder="비워두면 아이디를 사용합니다">
            </div>
            <div class="form-field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-field">
                <label for="password_confirm">비밀번호 확인</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit">회원가입</button>
        </form>
        <p class="small-text auth-footnote">이미 계정이 있다면 <a href="{{ url_for('login') }}">로그인</a>하세요.</p>
    </article>
</section>
{% endblock %}
