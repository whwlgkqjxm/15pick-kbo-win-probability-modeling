{% extends "_base.html" %}

{% block content %}
<section class="landing-hero landing-only" aria-label="MyPick 시작 페이지">
    <span class="landing-light landing-light-one" aria-hidden="true"></span>
    <span class="landing-light landing-light-two" aria-hidden="true"></span>
    <span class="landing-light landing-light-three" aria-hidden="true"></span>
    <span class="landing-orbit landing-orbit-one" aria-hidden="true"></span>
    <span class="landing-orbit landing-orbit-two" aria-hidden="true"></span>
    <span class="landing-glow" aria-hidden="true"></span>

    <div class="landing-auth" aria-label="입장 메뉴">
        {% if current_user %}
            <a class="landing-auth-link" href="{{ url_for('logout') }}">로그아웃</a>
            <a class="landing-auth-cta" href="{{ url_for('my_team') }}">내 팀</a>
        {% else %}
            <a class="landing-auth-link" href="{{ url_for('register') }}">회원가입</a>
            <a class="landing-auth-cta" href="{{ url_for('login') }}">로그인</a>
        {% endif %}
    </div>

    <div class="landing-hero-inner">
        <p class="landing-eyebrow">KBO Fantasy</p>
        <h1 class="landing-title-main">My<span class="landing-title-pick">Pick</span></h1>
        <p class="landing-copy">
            자신의 드림팀을 픽하고 승리에 배팅하여 한국 최고의 야구 전문가임을 증명하세요.
        </p>
        <div class="landing-actions" aria-label="시작 메뉴">
            <a class="button-link hero-primary" href="{{ url_for('center') }}">
                시작하기 <span aria-hidden="true">›</span>
            </a>
            <a class="button-link hero-secondary" href="{{ url_for('play_guide') }}">플레이 가이드</a>
        </div>
    </div>
</section>
{% endblock %}
